name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Build with Jekyll
        run: bundle exec jekyll build --source site --config site/_config.yml

  # Extension + React client build. Exercises the production `vite build` (the
  # Rollup resolver), which neither `tsc -b` nor vitest run — that gap once
  # shipped a blank webview when vite.config.ts lacked the `@protocol` alias.
  extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install root deps
        run: npm ci
      - name: Install client deps
        run: npm ci --prefix client/simulator
      - name: Build client webview (tsc -b && vite build)
        run: npm run build --prefix client/simulator
      - name: Compile extension (esbuild)
        run: npm run compile
      - name: Test
        run: npm test